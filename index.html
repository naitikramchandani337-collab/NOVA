<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA | AI Learning Platform</title>
    <!-- Import Tailwind CSS for easy styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Import Google Fonts: Space Grotesk for that Sci-Fi feel -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow-x: hidden;
            font-family: 'Space Grotesk', sans-serif;
            background-color: #030305; /* Deep space black */
            color: white;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            outline: none;
        }
        /* Hide scrollbar for cleaner look */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        .glass-button {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .glass-button:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }
        .hero-text-gradient {
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>

    <!-- UI Overlay -->
    <main class="relative z-10 w-full min-h-screen flex flex-col justify-between p-8 md:p-20 pointer-events-none">
        
        <!-- Header -->
        <header class="flex justify-between items-center pointer-events-auto">
            <div class="text-2xl font-bold tracking-widest flex items-center gap-2">
                <span class="w-3 h-3 bg-cyan-400 rounded-full animate-pulse"></span>
                NOVA
            </div>
            <nav class="hidden md:flex gap-8 text-sm text-gray-400 uppercase tracking-widest">
                <a href="#" class="hover:text-white transition-colors">Phases</a>
                <a href="#" class="hover:text-white transition-colors">Rocket</a>
                <a href="#" class="hover:text-white transition-colors">Login</a>
            </nav>
        </header>

        <!-- Hero Content -->
        <section class="flex flex-col items-start max-w-2xl mt-20 pointer-events-auto">
            <div class="inline-block px-3 py-1 mb-4 border border-cyan-500/30 rounded-full text-xs text-cyan-400 tracking-widest uppercase">
                Mission Start
            </div>
            <h1 class="text-6xl md:text-8xl font-bold leading-tight mb-6">
                MASTER AI.<br>
                <span class="text-cyan-400">BUILD THE FUTURE.</span>
            </h1>
            <p class="text-gray-400 text-lg md:text-xl max-w-lg mb-8 leading-relaxed">
                An interactive journey through 10 phases of artificial intelligence. Learn PyTorch, build your rocket, and launch your career.
            </p>
            <div class="flex gap-4">
                <button class="glass-button px-8 py-4 rounded-lg text-lg font-bold tracking-wide text-white">
                    START PHASE 1
                </button>
                <button class="glass-button px-8 py-4 rounded-lg text-lg font-medium text-gray-300 flex items-center gap-2">
                    WATCH TRAILER
                </button>
            </div>
        </section>

        <!-- Scroll Indicator -->
        <div class="flex justify-between items-end pointer-events-auto">
            <div class="text-xs text-gray-500 tracking-widest">
                SCROLL TO EXPLORE MAP
            </div>
            <div class="flex flex-col items-center gap-2 animate-bounce">
                <span class="text-[10px] text-gray-500">INITIATE</span>
                <div class="w-[1px] h-12 bg-gradient-to-b from-cyan-500 to-transparent"></div>
            </div>
        </div>
    </main>

    <!-- Three.js Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        // Add subtle fog for depth
        scene.fog = new THREE.FogExp2(0x030305, 0.002);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Performance optimization
        document.body.appendChild(renderer.domElement);

        // --- 2. THE "MOON" (AI CORE) ---
        
        // Geometry
        const geometry = new THREE.SphereGeometry(2, 64, 64);
        
        // Material: High-tech dark surface with subtle roughness
        const material = new THREE.MeshStandardMaterial({
            color: 0x1a1a2e,
            roughness: 0.7,
            metalness: 0.3,
            flatShading: false
        });

        const moon = new THREE.Mesh(geometry, material);
        scene.add(moon);

        // --- 3. THE ATMOSPHERIC GLOW (SHADER) ---
        // This creates the "Venturi" style rim light
        
        const glowGeometry = new THREE.SphereGeometry(2.4, 64, 64);
        const glowMaterial = new THREE.ShaderMaterial({
            uniforms: {
                c: { type: "f", value: 0.3 },
                p: { type: "f", value: 4.5 },
                glowColor: { type: "c", value: new THREE.Color(0x00ffff) },
                viewVector: { type: "v3", value: camera.position }
            },
            vertexShader: `
                uniform vec3 viewVector;
                varying float intensity;
                void main() {
                    vec3 vNormal = normalize(normalMatrix * normal);
                    vec3 vNormel = normalize(normalMatrix * viewVector);
                    intensity = pow(c - dot(vNormal, vNormel), p);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 glowColor;
                varying float intensity;
                void main() {
                    vec3 glow = glowColor * intensity;
                    gl_FragColor = vec4(glow, 1.0);
                }
            `,
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending,
            transparent: true
        });

        const glowMesh = new THREE.Mesh(glowGeometry, glowMaterial);
        scene.add(glowMesh);

        // --- 4. STARS (BACKGROUND) ---
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 2000;
        const starPos = new Float32Array(starCount * 3);
        
        for(let i = 0; i < starCount * 3; i++) {
            starPos[i] = (Math.random() - 0.5) * 50; // Spread stars wide
        }
        
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.03, transparent: true, opacity: 0.8 });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        // --- 5. LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0x404040, 2); // Soft blue-ish ambient
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
        directionalLight.position.set(5, 3, 5);
        scene.add(directionalLight);
        
        const blueLight = new THREE.PointLight(0x00ffff, 1, 10);
        blueLight.position.set(-2, 1, 2);
        scene.add(blueLight);

        // --- 6. ANIMATION & INTERACTION LOGIC ---
        
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;

        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        // Mouse Move Event (Parallax)
        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - windowHalfX);
            mouseY = (event.clientY - windowHalfY);
        });

        // Scroll Event (Launch Effect)
        let scrollY = 0;
        window.addEventListener('scroll', () => {
            scrollY = window.scrollY;
        });

        const clock = new THREE.Clock();

        function animate() {
            const elapsedTime = clock.getElapsedTime();

            // Smooth Parallax
            targetX = mouseX * 0.001;
            targetY = mouseY * 0.001;

            // Rotate Moon (Base rotation + Mouse influence + Scroll influence)
            moon.rotation.y += 0.002;
            moon.rotation.x += 0.001;
            
            // Parallax Tilt
            moon.rotation.y += 0.05 * (targetX - moon.rotation.y);
            moon.rotation.x += 0.05 * (targetY - moon.rotation.x);

            // Scroll Effect: Move moon away slightly and spin faster
            if (scrollY > 0) {
                moon.position.z = 5 + (scrollY * 0.005); // Push back
                moon.rotation.y += scrollY * 0.0005; // Spin faster
                stars.rotation.y -= scrollY * 0.0002; // Stars rotate opposite
            }

            // Update Glow Shader to face camera
            glowMesh.lookAt(camera.position);

            // Star Movement (Drifting)
            stars.rotation.y -= 0.0002;
            stars.rotation.x += (mouseY * 0.00001);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        animate();

        // Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
